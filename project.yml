name: Pickr
options:
  bundleIdPrefix: fractals
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 2.0.0
targets:
  Pickr:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      - package: KeyboardShortcuts
    sources:
      - path: Sources/Pickr
    info:
      path: Info.plist
      # XcodeGen REGENERATES Info.plist from this block on every `xcodegen generate`.
      # Anything not declared here is silently dropped from the built app — that is how
      # LSMinimumSystemVersion and LSApplicationCategoryType went missing, and why a
      # hand-edited version number in Info.plist does not survive. Declare it all here.
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Pickr displays a live level meter so you can see your mic is active."
    settings:
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: YES
      ENABLE_APP_SANDBOX: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: Pickr.entitlements
      DEVELOPMENT_TEAM: ZB4AZ43PV4
      PRODUCT_BUNDLE_IDENTIFIER: fractals.pickr
      MARKETING_VERSION: "1.1"
      CURRENT_PROJECT_VERSION: "2"
